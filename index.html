<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan to Pay - 51Club</title>
    <!-- QR Code Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
        }
        .amount {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }
        .upi-id {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            color: #555;
            display: inline-block;
            margin-bottom: 20px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .footer {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Pay Now</h2>
    <div class="amount">₹10.00</div>
    
    <!-- The QR Code Container -->
    <div id="qrcode"></div>
    
    <div class="upi-id">51club@axl</div>
    
    <p class="footer">Scan with any UPI App (GPay, PhonePe, Paytm)</p>
</div>

<script>
    // Configuration
    const upiID = "51club@axl";
    const payeeName = "51Club";
    const amount = "10.00"; // You can change this to "" if you want user to enter amount
    const currency = "INR";

    // Construct UPI Link
    // Format: upi://pay?pa=address&pn=name&am=amount&cu=currency
    const upiLink = `upi://pay?pa=${upiID}&pn=${payeeName}&am=${amount}&cu=${currency}`;

    // Generate QR Code
    new QRCode(document.getElementById("qrcode"), {
        text: upiLink,
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>

</body>
</html>
